<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <!-- Kunci Mode Native PWA / Android WebView -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="msapplication-navbutton-color" content="#059669">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Styling agar responsif mirip aplikasi HP Native */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    * {
      -webkit-touch-callout: none; /* Matikan pop-up tekan lama */

    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');

</head>

      </div>

      <div class="bg-white rounded-2xl p-6 text-gray-800 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-center text-gray-700">Masuk Akun</h2>
        
        <div>
          <label class="text-xs font-semibold text-gray-500">Nomor HP</label>

      <!-- Quick Action Buttons -->

        </button>
        <button onclick="alert('Kontak Satpam: 0812-9999-8888')" class="bg-amber-50 p-3 rounded-xl border border-amber-100 text-amber-600 flex flex-col items-center">
          <i class="fa-solid fa-shield-halved text-xl mb-1"></i>
          <span class="text-xs font-semibold">Pos Satpam</span>
        </button>
        <button onclick="pindahTab('pengumuman')" class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-blue-600 flex flex-col items-center">
          <i class="fa-solid fa-bullhorn text-xl mb-1"></i>
          <span class="text-xs font-semibold">Pengumuman</span>

      </div>

      <!-- Section Pengumuman Terbaru -->
      <div class="px-5">

      <div id="list-pengumuman-full" class="space-y-3">
        <!-- Full list pengumuman -->

    </div>

    <!-- ========================================== -->
    <!-- 4. TAB LAPORAN / ADUAN -->
    <!-- ========================================== -->
    <div id="page-laporan" class="hidden p-5">
      <h2 class="font-bold text-lg mb-4 text-gray-800">Buat Laporan Aduan</h2>
      
      <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600">Judul Laporan</label>
          <input type="text" id="lap-judul" placeholder="Contoh: Lampu Jalan Blok A Mati" class="w-full border rounded-lg p-2.5 text-sm mt-1">

    <!-- ========================================== -->
    <!-- BOTTOM NAVIGATION BAR -->
    <!-- ========================================== -->
    <div id="bottom-nav" class="hidden fixed bottom-0 max-w-md w-full bg-white border-t flex justify-around py-2.5 text-gray-400 text-center text-xs z-40">
      <button onclick="pindahTab('dashboard')" id="nav-dashboard" class="text-emerald-600 font-bold">
        <i class="fa-solid fa-house text-lg block"></i> Home

  <!-- TOMBOL MELAYANG ADD PENGUMUMAN (ADMIN/RT) -->
  <div id="admin-action-btn" class="hidden fixed bottom-20 right-4 sm:right-auto max-w-md w-full pointer-events-none z-40 flex justify-end px-4">
    <button onclick="bukaModalPengumuman()" class="pointer-events-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition transform active:scale-95">
      <i class="fa-solid fa-plus text-2xl"></i>
    </button>
  </div>

  <!-- MODAL 1: TAMBAH PENGUMUMAN -->
  <div id="modal-pengumuman" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800">Buat Pengumuman Baru</h3>
        <button onclick="tutupModalPengumuman()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <div>
        <label class="text-xs font-semibold text-gray-600">Kategori</label>
        <select id="adm-kategori" class="w-full border rounded-lg p-2.5 text-sm mt-1 bg-white">
          <option value="Info RT">Info RT</option>
          <option value="Kegiatan">Kegiatan</option>
          <option value="Keuangan">Keuangan</option>
          <option value="Penting">Penting</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">Judul Pengumuman</label>
        <input type="text" id="adm-judul" placeholder="Contoh: Kerja Bakti Hari Minggu" class="w-full border rounded-lg p-2.5 text-sm mt-1">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">Isi Pengumuman</label>
        <textarea id="adm-isi" rows="3" placeholder="Tuliskan detail informasi..." class="w-full border rounded-lg p-2.5 text-sm mt-1"></textarea>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="tutupModalPengumuman()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg text-sm">Batal</button>
        <button onclick="simpanPengumumanAdmin()" id="btn-simpan-pengumuman" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">Terbitkan</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: EDIT PENGUMUMAN -->
  <div id="modal-edit-pengumuman" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800">Edit Pengumuman</h3>
        <button onclick="tutupModalEdit()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <input type="hidden" id="edit-id-info">

      <div>
        <label class="text-xs font-semibold text-gray-600">Kategori</label>
        <select id="edit-kategori" class="w-full border rounded-lg p-2.5 text-sm mt-1 bg-white">
          <option value="Info RT">Info RT</option>
          <option value="Kegiatan">Kegiatan</option>
          <option value="Keuangan">Keuangan</option>
          <option value="Penting">Penting</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">Judul Pengumuman</label>
        <input type="text" id="edit-judul" class="w-full border rounded-lg p-2.5 text-sm mt-1">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-600">Isi Pengumuman</label>
        <textarea id="edit-isi" rows="3" class="w-full border rounded-lg p-2.5 text-sm mt-1"></textarea>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="tutupModalEdit()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg text-sm">Batal</button>
        <button onclick="prosesSimpanEdit()" id="btn-simpan-edit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT & INTEGRASI BACKEND (GAS) -->
  <!-- ========================================== -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYwsbixp0Wvuily2-I48hQhXMdL42T4JkkSlB-qX5ySpsnHzGnxqDhOXwnsQdEVIgGnA/exec";

    let currentUser = null;

    // --- FUNCTION LOGIN ---
    function prosesLogin() {
      const nohp = document.getElementById("login-nohp").value;
      const pass = document.getElementById("login-password").value;
      const btn = document.getElementById("btn-login");

      if (!nohp || !pass) {
        alert("Mohon isi Nomor HP dan Password!");
        return;
      }

      btn.innerText = "Memproses...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "login", no_hp: nohp, password: pass })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "MASUK";
        btn.disabled = false;

        if (data.status === "success") {
          currentUser = data.user;
          document.getElementById("user-nama").innerText = currentUser.nama;
          document.getElementById("user-norumah").innerText = "Blok " + currentUser.no_rumah;
          
          // Sembunyikan Login, Tampilkan Dashboard & Bottom Nav
          document.getElementById("page-login").classList.add("hidden");
          document.getElementById("page-dashboard").classList.remove("hidden");
          document.getElementById("page-dashboard").classList.add("flex");
          document.getElementById("bottom-nav").classList.remove("hidden");

          // Saklar Tombol Plus & Load Data
          checkAdminRole();
          loadPengumuman();
        } else {
          alert(data.message);
        }
      })
      .catch(err => {
        btn.innerText = "MASUK";
        btn.disabled = false;
        alert("Gagal terhubung ke server: " + err);
      });
    }

    // --- FUNCTION AMBIL PENGUMUMAN ---
    function loadPengumuman() {
  fetch(API_URL + "?action=getPengumuman")
    .then(res => {
      // Cek apakah response berupa HTML (biasanya karena error 404/permission Google)
      const contentType = res.headers.get("content-type");
      if (contentType && contentType.indexOf("application/json") === -1) {
        return res.text().then(text => {
          throw new Error("Server mengembalikan HTML/Error bukan JSON. Cek izin deployment Apps Script (Harus 'Anyone').");
        });
      }
      return res.json();
    })
    .then(res => {
      if (res.status === 'success') {
        const containerHome = document.getElementById('list-pengumuman-home');
        const containerFull = document.getElementById('list-pengumuman-full');
        
        if (containerHome) containerHome.innerHTML = '';
        if (containerFull) containerFull.innerHTML = '';

        if (!res.data || res.data.length === 0) {
          const emptyMsg = `<p class="text-xs text-gray-400 italic text-center py-4">Belum ada pengumuman.</p>`;
          if (containerHome) containerHome.innerHTML = emptyMsg;
          if (containerFull) containerFull.innerHTML = emptyMsg;
          return;
        }

        res.data.forEach((item, index) => {
          let actionButtons = '';
          if (currentUser && currentUser.role && ['admin', 'rt'].includes(currentUser.role.toLowerCase())) {
            actionButtons = `
              <div class="flex gap-3 mt-3 pt-2 border-t border-gray-100 text-xs">
                <button onclick="openModalEdit('${item.id_info}', \`${item.judul}\`, \`${item.isi}\`, '${item.kategori}')" class="text-blue-600 font-semibold hover:underline flex items-center gap-1">
                  ✏️ Edit
                </button>
                <button onclick="hapusPengumuman('${item.id_info}')" class="text-red-600 font-semibold hover:underline flex items-center gap-1">
                  🗑️ Hapus
                </button>
              </div>
            `;
          }

          const cardHtml = `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs bg-emerald-100 text-emerald-700 font-medium px-2 py-0.5 rounded-full">${item.kategori}</span>
                <span class="text-xs text-gray-400">${item.tanggal}</span>
              </div>
              <h3 class="font-bold text-gray-800 text-sm mt-1">${item.judul}</h3>
              <p class="text-xs text-gray-600 mt-1">${item.isi}</p>
              ${actionButtons}
            </div>
          `;

          if (index < 2 && containerHome) containerHome.innerHTML += cardHtml;
          if (containerFull) containerFull.innerHTML += cardHtml;
        });
      } else {
        console.error("Gagal memuat data:", res.message);
      }
    })
    .catch(err => {
      console.error("Error Load Pengumuman:", err);
      const containerHome = document.getElementById('list-pengumuman-home');
      if (containerHome) {
        containerHome.innerHTML = `<p class="text-xs text-red-500 italic text-center py-4">Gagal memuat pengumuman. Periksa koneksi API.</p>`;
      }
    });
}
    // --- FUNCTION KIRIM LAPORAN ---
    function kirimLaporan() {
      const judul = document.getElementById("lap-judul").value;
      const deskripsi = document.getElementById("lap-deskripsi").value;
      const btn = document.getElementById("btn-kirim-laporan");

      if (!judul || !deskripsi) {
        alert("Mohon lengkapi judul dan deskripsi laporan!");
        return;
      }

      btn.innerText = "Mengirim...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "kirimLaporan",
          nama_pelapor: currentUser.nama,
          no_rumah: currentUser.no_rumah,
          judul_laporan: judul,
          deskripsi: deskripsi
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "KIRIM LAPORAN";
        btn.disabled = false;
        alert(data.message);
        
        document.getElementById("lap-judul").value = "";
        document.getElementById("lap-deskripsi").value = "";
        pindahTab('dashboard');
      });
    }

    // --- NAVIGATION TAB SWITCHER ---
    function pindahTab(tabName) {
      document.getElementById("page-dashboard").classList.add("hidden");
      document.getElementById("page-dashboard").classList.remove("flex");
      document.getElementById("page-pengumuman").classList.add("hidden");
      document.getElementById("page-laporan").classList.add("hidden");

      document.querySelectorAll("#bottom-nav button").forEach(b => b.className = "text-gray-400");

      if (tabName === 'dashboard') {
        document.getElementById("page-dashboard").classList.remove("hidden");
        document.getElementById("page-dashboard").classList.add("flex");
        document.getElementById("nav-dashboard").className = "text-emerald-600 font-bold";
      } else if (tabName === 'pengumuman') {
        document.getElementById("page-pengumuman").classList.remove("hidden");
        document.getElementById("nav-pengumuman").className = "text-emerald-600 font-bold";
      } else if (tabName === 'laporan') {
        document.getElementById("page-laporan").classList.remove("hidden");
        document.getElementById("nav-laporan").className = "text-emerald-600 font-bold";
      }
    }

    // --- LOGOUT ---
    function logout() {
      currentUser = null;
      document.getElementById("page-dashboard").classList.add("hidden");
      document.getElementById("page-dashboard").classList.remove("flex");
      document.getElementById("bottom-nav").classList.add("hidden");
      document.getElementById("admin-action-btn").classList.add("hidden");
      document.getElementById("page-login").classList.remove("hidden");
    }

    // Cek Role Admin / RT
    function checkAdminRole() {
      if (currentUser && currentUser.role && ['admin', 'rt'].includes(currentUser.role.toLowerCase())) {
        document.getElementById("admin-action-btn").classList.remove("hidden");
      } else {
        document.getElementById("admin-action-btn").classList.add("hidden");
      }
    }

    // MODAL TAMBAH
    function bukaModalPengumuman() {
      document.getElementById("modal-pengumuman").classList.remove("hidden");
    }

    function tutupModalPengumuman() {
      document.getElementById("modal-pengumuman").classList.add("hidden");
      document.getElementById("adm-judul").value = "";
      document.getElementById("adm-isi").value = "";
    }

    function simpanPengumumanAdmin() {
      const kategori = document.getElementById("adm-kategori").value;
      const judul = document.getElementById("adm-judul").value;
      const isi = document.getElementById("adm-isi").value;
      const btn = document.getElementById("btn-simpan-pengumuman");

      if (!judul || !isi) {
        alert("Mohon lengkapi Judul dan Isi Pengumuman!");
        return;
      }

      btn.innerText = "Menerbitkan...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "tambahPengumuman",
          kategori: kategori,
          judul: judul,
          isi: isi
        })
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "Terbitkan";
        btn.disabled = false;
        alert(data.message);
        tutupModalPengumuman();
        loadPengumuman();
      })
      .catch(err => {
        btn.innerText = "Terbitkan";
        btn.disabled = false;
        alert("Gagal menerbitkan pengumuman: " + err);
      });
    }

    // MODAL EDIT & FUNGSI AKSI
    function openModalEdit(idInfo, judul, isi, kategori) {
      document.getElementById("edit-id-info").value = idInfo;
      document.getElementById("edit-judul").value = judul;
      document.getElementById("edit-isi").value = isi;
      document.getElementById("edit-kategori").value = kategori;
      document.getElementById("modal-edit-pengumuman").classList.remove("hidden");
    }

    function tutupModalEdit() {
      document.getElementById("modal-edit-pengumuman").classList.add("hidden");
    }

    function prosesSimpanEdit() {
      const idInfo = document.getElementById("edit-id-info").value;
      const judul = document.getElementById("edit-judul").value;
      const isi = document.getElementById("edit-isi").value;
      const kategori = document.getElementById("edit-kategori").value;
      const btn = document.getElementById("btn-simpan-edit");

      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'editPengumuman',
          id_info: idInfo,
          judul: judul,
          isi: isi,
          kategori: kategori
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.innerText = "Simpan";
        btn.disabled = false;
        if (res.status === 'success') {
          alert(res.message);
          tutupModalEdit();
          loadPengumuman();
        } else {
          alert("Gagal memperbarui: " + res.message);
        }
      })
      .catch(err => {
        btn.innerText = "Simpan";
        btn.disabled = false;
        alert("Error: " + err.message);
      });
    }

    // FUNGSI HAPUS
    function hapusPengumuman(idInfo) {
      if (!confirm("Apakah Anda yakin ingin menghapus pengumuman ini?")) return;

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'hapusPengumuman',
          id_info: idInfo
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          alert(res.message);
          loadPengumuman();
        } else {
          alert("Gagal menghapus: " + res.message);
        }
      })
      .catch(err => alert("Error: " + err.message));
    }
  </script>
